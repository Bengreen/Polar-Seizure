name: Android App CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          ref: ${{ github.event.merge_group.base_ref || github.ref }}
          filters: |
            android:
              - 'android-app/**'
              - '.github/workflows/android-ci.yml'

  check-image:
    needs: check-paths
    if: needs.check-paths.outputs.android == 'true'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      content_sha: ${{ steps.android-content.outputs.ANDROID_SHA }}
      short_sha: ${{ steps.android-content.outputs.SHORT_SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Android Content SHA
        id: android-content
        run: |
          ANDROID_SHA=$(git log -1 --format=%H -- android-app/ .github/workflows/android-ci.yml)
          echo "ANDROID_SHA=$ANDROID_SHA" >> $GITHUB_OUTPUT
          SHORT_SHA=$(echo "$ANDROID_SHA" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Determine Image Name
        id: image-name
        run: |
          repo_name="${{ github.repository }}"
          echo "IMAGE_NAME_LOWERCASE=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')-app" >> $GITHUB_OUTPUT

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ steps.image-name.outputs.IMAGE_NAME_LOWERCASE }}:sha-${{ steps.android-content.outputs.ANDROID_SHA }}"
          echo "Checking if package exists: $IMAGE_REF"
          if docker manifest inspect $IMAGE_REF >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Package exists!"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Package does not exist."
          fi

  test-and-build:
    needs: [check-paths, check-image]
    if: needs.check-paths.outputs.android == 'true' && (needs.check-image.outputs.exists != 'true' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-app

      - name: Run Unit Tests & Lint
        run: ./gradlew testDebugUnitTest
        working-directory: android-app

      - name: Build Android APK
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleDebug
        working-directory: android-app

      - name: Package & Label SHA Artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/polar-seizure-app-sha-${{ needs.check-image.outputs.short_sha }}.apk
        working-directory: android-app

      - name: Upload Android Build Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: polar-seizure-apk-sha-${{ needs.check-image.outputs.short_sha }}
          path: android-app/artifacts/polar-seizure-app-sha-${{ needs.check-image.outputs.short_sha }}.apk
          retention-days: 30

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Name
        if: github.event_name != 'pull_request'
        id: image-name
        run: |
          repo_name="${{ github.repository }}"
          echo "IMAGE_NAME_LOWERCASE=$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')-app" >> $GITHUB_OUTPUT

      - name: Build and Push OCI Package to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./android-app
          file: ./android-app/Dockerfile
          build-args: |
            APK_FILE=artifacts/polar-seizure-app-sha-${{ needs.check-image.outputs.short_sha }}.apk
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.IMAGE_NAME_LOWERCASE }}:sha-${{ needs.check-image.outputs.content_sha }}
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.IMAGE_NAME_LOWERCASE }}:sha-${{ needs.check-image.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.IMAGE_NAME_LOWERCASE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Polar-Seizure Android Application
