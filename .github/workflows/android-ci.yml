name: Android App CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          ref: ${{ github.event.merge_group.base_ref || github.ref }}
          filters: |
            android:
              - 'android-app/**'
              - '.github/workflows/android-ci.yml'

  check-artifact:
    needs: check-paths
    if: needs.check-paths.outputs.android == 'true'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      content_sha: ${{ steps.android-content.outputs.ANDROID_SHA }}
      short_sha: ${{ steps.android-content.outputs.SHORT_SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Android Content SHA
        id: android-content
        run: |
          ANDROID_SHA=$(git log -1 --format=%H -- android-app/ .github/workflows/android-ci.yml)
          echo "ANDROID_SHA=$ANDROID_SHA" >> $GITHUB_OUTPUT
          SHORT_SHA=$(echo "$ANDROID_SHA" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Check if workflow artifact exists for this SHA
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="polar-seizure-apk-sha-${{ steps.android-content.outputs.SHORT_SHA }}"
          echo "Searching for artifact: $ARTIFACT_NAME"
          COUNT=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}" --jq '.total_count' 2>/dev/null || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Artifact exists in Actions cache!"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Artifact does not exist."
          fi

  test-and-build:
    needs: [check-paths, check-artifact]
    if: needs.check-paths.outputs.android == 'true' && (needs.check-artifact.outputs.exists != 'true' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-app

      - name: Run Unit Tests & Lint
        run: ./gradlew testDebugUnitTest
        working-directory: android-app

      - name: Build Android APK
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleDebug
        working-directory: android-app

      - name: Package & Label SHA Artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/polar-seizure-app-sha-${{ needs.check-artifact.outputs.short_sha }}.apk
        working-directory: android-app

      - name: Upload Android Build Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: polar-seizure-apk-sha-${{ needs.check-artifact.outputs.short_sha }}
          path: android-app/artifacts/polar-seizure-app-sha-${{ needs.check-artifact.outputs.short_sha }}.apk
          retention-days: 30
